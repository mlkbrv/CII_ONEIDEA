name: cci

services:
  postgres:
    image: postgres:16
    container_name: cci-postgres
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cci
    volumes:
      - cci_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci -d cci"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: cci-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cci:postgres@postgres:5432/cci
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL}
      JWT_SECRET: ${JWT_SECRET}
      PROMO_CODE_PEPPER: ${PROMO_CODE_PEPPER}
      BOT_POLLING: "true"
    ports:
      - "18080:8000"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cci-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cci_pgdata:
