services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cci
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci -d cci"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cci:postgres@postgres:5432/cci
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL}
      JWT_SECRET: ${JWT_SECRET}
      PROMO_CODE_PEPPER: ${PROMO_CODE_PEPPER}
      BOT_POLLING: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
