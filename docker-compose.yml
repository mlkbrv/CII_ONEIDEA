# Cola Fest — four containers, zero host ports.
#
# The server this runs on already hosts other projects: one of them owns port
# 80 (an nginx container) and another owns 443 (a Caddy container). Publishing
# a port here would either collide outright or require editing somebody else's
# reverse proxy config.
#
# Cloudflare Tunnel avoids the question entirely. `cloudflared` makes an
# OUTBOUND connection to Cloudflare, so nothing is bound on the host at all,
# and Cloudflare terminates TLS — which a Telegram Mini App requires and which
# would otherwise mean fitting a certificate into a proxy we do not own.

name: cci

services:
  postgres:
    image: postgres:16
    container_name: cci-postgres
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cci
    volumes:
      - cci_pgdata:/var/lib/postgresql/data
    # `expose`, not `ports`: reachable from the other containers on this
    # project's network and from nowhere else.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci -d cci"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: cci-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://cci:${POSTGRES_PASSWORD}@postgres:5432/cci
      # The sweeper and the bot belong to the worker; see app/worker.py.
      RUN_SWEEPER: "false"
    expose:
      - "8000"
    healthcheck:
      # /health deliberately does not touch the database: restarting the API
      # cannot fix Postgres, so a DB blip must not take the API out of rotation.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    build: .
    container_name: cci-worker
    depends_on:
      # Waits for the API because the API runs the migrations. Starting the
      # worker against a schema that has not been upgraded yet would crash it
      # in a restart loop until the API happened to win the race.
      api:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://cci:${POSTGRES_PASSWORD}@postgres:5432/cci
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

  # Before the real domain exists: a Cloudflare quick tunnel. It prints a
  # random https://<something>.trycloudflare.com URL in its logs, needs no
  # account and no token, and still binds nothing on the host — enough to open
  # the app on a phone and even to point a test bot at it.
  #
  #   docker compose --profile preview up -d preview
  #   docker compose logs preview | grep trycloudflare
  #
  # The URL changes on every restart, so it is for testing only.
  preview:
    image: cloudflare/cloudflared:latest
    container_name: cci-preview
    profiles: ["preview"]
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cci-tunnel
    # A profile, so the stack can be brought up and tested before a hostname
    # exists. With ./cloudflared populated, `--profile tunnel` publishes it.
    profiles: ["tunnel"]
    depends_on:
      api:
        condition: service_healthy
    # Locally-managed tunnel: the credentials live in ./cloudflared on the
    # server, created once with
    #     cloudflared tunnel login          (one browser click)
    #     cloudflared tunnel create cci
    #     cloudflared tunnel route dns cci <hostname>
    #
    # This route was chosen over a dashboard token because the Zero Trust
    # dashboard asks for a payment method during onboarding even on its free
    # tier. The CLI path uses an ordinary Cloudflare login, costs nothing, and
    # produces the same named tunnel and the same permanent hostname.
    #
    # The directory is owned by uid 65532 — the image runs as nonroot, and a
    # root-owned mount makes it fail to read its own credentials.
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    # --url is the whole ingress rule: everything on the hostname goes to the
    # API container. No config.yml to keep in sync with compose.
    command: tunnel --no-autoupdate run --url http://api:8000 ${TUNNEL_NAME:-cci}
    restart: unless-stopped

volumes:
  cci_pgdata:
