[project]
name = "cci-backend"
version = "0.2.0"
description = "CCI Cola Fest — gamified Coca-Cola engagement backend (Telegram Mini App + PWA)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "aiogram>=3.17.0",
    "defusedxml>=0.7.1",
    "reportlab>=4.2.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
