<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#E4002B" />
    <title>Cola Fest</title>
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app/icon.svg" />
    <!--
      Telegram's SDK must load before the app so window.Telegram.WebApp is
      there on first render — the app decides how to authenticate based on
      whether it exists, and a late answer means a flash of the wrong screen.
      It is harmlessly absent when the page is opened in a normal browser.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
